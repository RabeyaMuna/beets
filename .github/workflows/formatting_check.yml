name: formatting_check
run-name: Check code formatting
on: push
jobs:
  formatting_check:
    runs-on: ubuntu-latest
    services:
      pypi_wayback:
        image: ghcr.io/waleko/pypi-wayback
        ports:
        - 8629:8080
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install tox
      run: |
        PIP_INDEX_URL=https://pypi.org/simple pip install tox

    - name: Run formatting check
      run: tox -e format_check

env:
  PIP_INDEX_URL: http://localhost:8629/2023-12-15
  UV_INDEX_URL: http://localhost:8629/2023-12-15
